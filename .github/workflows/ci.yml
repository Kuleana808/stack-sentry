name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Marketing pages must build with no backend credentials. Do not add
      # placeholder Supabase/Stripe keys here — that would hide a regression.
      - name: Build
        run: npm run build

      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high
